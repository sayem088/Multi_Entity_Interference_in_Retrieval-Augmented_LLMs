[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mei"
version = "0.1.0"
description = "Multi-Entity Interference (MEI) Measurement Framework"
authors = [{ name = "Md Abu Sayem Sarker" }]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]
gpu = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "huggingface_hub>=0.20.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0"
]

[tool.setuptools.packages.find]
where = ["src"]
