domains:
  - id: "domain1_geo"
    name: "GeoAI (OpenStreetMap Spatial Infrastructure)"
    source_type: "osm"
    categories:
      - "hospital"
      - "restaurant"
      - "school"
      - "bank"
      - "pharmacy"
      - "park"
      - "hotel"
      - "airport"
    attributes:
      - "name"
      - "capacity"
      - "opening_hours"
      - "rating"
      - "phone"
      - "website"
      - "wheelchair"
      - "postcode"

  - id: "domain2_health"
    name: "Healthcare (Clinical Trials & Pharmacology)"
    source_type: "clinical"
    categories:
      - "oncology_trial"
      - "cardiology_trial"
      - "neurology_trial"
      - "infectious_disease_trial"
      - "pharmaceutical_drug"
      - "medical_device"
      - "diagnostic_facility"
      - "vaccine_study"
    attributes:
      - "study_or_drug_name"
      - "phase"
      - "target_condition"
      - "intervention_dosage"
      - "sample_size"
      - "primary_endpoint"
      - "adverse_event_rate"
      - "completion_year"

  - id: "domain3_wiki"
    name: "Public Knowledge (Wikidata & Wikipedia Infoboxes)"
    source_type: "wikipedia"
    categories:
      - "university"
      - "country"
      - "company"
      - "stadium"
      - "museum"
      - "river"
      - "spacecraft"
      - "bridge"
    attributes:
      - "established"
      - "location"
      - "students_or_employees"
      - "budget_or_gdp"
      - "motto"
      - "website"
      - "leader_name"
      - "area"
