domains:
  - id: "domain1_poi"
    name: "OpenStreetMap POI"
    source_type: "osm"
    categories:
      - "hospital"
      - "restaurant"
      - "school"
      - "bank"
      - "pharmacy"
      - "park"
      - "hotel"
      - "supermarket"
    attributes:
      - "name"
      - "capacity"
      - "opening_hours"
      - "rating"
      - "phone"
      - "website"
      - "wheelchair"
      - "postcode"

  - id: "domain2_wiki"
    name: "Wikipedia Infoboxes"
    source_type: "wikipedia"
    categories:
      - "university"
      - "country"
      - "company"
      - "stadium"
      - "museum"
      - "river"
      - "spacecraft"
      - "bridge"
    attributes:
      - "established"
      - "location"
      - "students_or_employees"
      - "budget_or_gdp"
      - "motto"
      - "website"
      - "leader_name"
      - "area"
